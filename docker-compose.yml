# =============================================================================
# Security Pulse — Docker Compose (local development only)
# =============================================================================
# Usage:
#   docker compose up -d          Start all services
#   docker compose down           Stop and remove containers
#   docker compose down -v        Stop and remove containers + volumes
#   docker compose logs -f api    Follow API logs
#
# This file is for local development only.
# Do not use this configuration for staging or production.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: security_pulse
      POSTGRES_PASSWORD: changeme_local
      POSTGRES_DB: security_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_pulse -d security_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ALLOW_MOCK_AUTH: "true"
      DATABASE_URL: postgresql+asyncpg://security_pulse:changeme_local@postgres:5432/security_pulse
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: dev-secret-key-do-not-use-in-production
      API_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./services/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
