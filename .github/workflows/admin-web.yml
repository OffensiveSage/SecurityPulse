name: Admin Web

on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Type-check, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build
